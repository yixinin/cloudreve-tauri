[package]
name = "crcli"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "crcli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
reqwest = { path = "../../reqwest", version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "multipart",
    "stream",
    "http3",
] }
tauri = { version = "2.7", features = [] }
tauri-plugin-fs = "2.4"
tauri-plugin-opener = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7.1"
serde_repr = "0.1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.3"
image = "0.25"
md5 = "0.8"
tauri-plugin-dialog = "2.3"
tokio = { version = "1.46", features = ["full"] }
anyhow = "1"
tauri-plugin-store = { version = "2.3" }
tauri-plugin-app-events = "0.2"
tokio-util = "0.7"
urlencoding = "2.1"
regex = "1.11"
futures-util = "0.3"
read-progress-stream = "1"
thiserror = "2"
stunclient = "0.4.1"
quinn = { version = "0.11.6" }
h3 = "0.0.8"
h3-quinn = "0.0.10"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
http = "1.3"
bytes = "1"
socket2 = { version = "0.6", features = ["all"] }
lazy_static = "1"
redb = "2.6"
